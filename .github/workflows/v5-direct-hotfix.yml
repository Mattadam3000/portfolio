name: V5 Direct Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v5-direct-hotfix.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply source fixes
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path('content.json')
          data = json.loads(p.read_text())
          blocks = {b['id']: b for b in data['blocks']}
          blocks['weeknd']['body'][0]['layout'] = 'beat flip'
          blocks['benny']['body'][0]['layout'] = 'beat'
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          t = Path('template.html')
          s = t.read_text()
          old = '<div class="bar mono"><a href="/" class="mark">MATT ADAM</a><span>LOS ANGELES</span></div>'
          new = '<div class="bar"><a href="/" class="mark">MATT ADAM</a><span class="mono">LOS ANGELES</span></div>'
          if old not in s:
              raise SystemExit('homepage bar signature not found')
          t.write_text(s.replace(old, new, 1))
          PY
      - name: Build and validate homepage
        run: |
          python3 clean_template_jsonld.py
          python3 build.py
          python3 structured_data.py
          python3 structured_data.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Smoke test
        run: |
          cd test
          npm install --no-audit --no-fund
          cd ..
          node test/smoke.js
      - name: Prove work untouched
        run: |
          test -z "$(git diff --name-only -- work/index.html work.json build_work.py admin/work/)"
      - name: Commit source fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content.json template.html index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix homepage V5 layouts and header sizing [skip ci]'
          git push
