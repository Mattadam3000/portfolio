name: Build site

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build.yml
      - add_instagram.py
      - content.json
      - work.json
      - photography.json
      - 'photography/edit/**'
      - photography-template.html
      - build_photography.py
      - parts.html
      - template.html
      - build.py
      - build_work.py
      - structured_data.py
      - clean_template_jsonld.py
      - 'img/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Remove legacy hand-maintained JSON-LD from template
        run: python3 clean_template_jsonld.py

      - name: Build homepage
        run: python3 build.py

      - name: Build work page
        run: python3 build_work.py

      - name: Build photography page
        run: python3 build_photography.py

      - name: Add Instagram links
        run: python3 add_instagram.py

      - name: Generate structured data from CMS content
        run: |
          python3 structured_data.py
          python3 structured_data.py --check

      - name: Commit generated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add template.html index.html work/index.html photography
          if git diff --cached --quiet; then
            echo "Generated site is already current."
          else
            git commit -m "Rebuild portfolio [skip ci]"
            git push
          fi

      - name: Publish rebuilt site and verify Pages build
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const { data: head } = await github.rest.git.getRef({ owner, repo, ref: 'heads/main' });
            const expected = head.object.sha;
            await github.request('POST /repos/{owner}/{repo}/pages/builds', { owner, repo });
            for (let attempt = 0; attempt < 60; attempt++) {
              await new Promise(resolve => setTimeout(resolve, 5000));
              const { data: build } = await github.request('GET /repos/{owner}/{repo}/pages/builds/latest', { owner, repo });
              if (build.commit !== expected) continue;
              if (build.status === 'errored') throw new Error(build.error?.message || 'Pages build failed');
              if (build.status === 'built') return;
            }
            throw new Error(`Timed out waiting for Pages to publish ${expected}`);
