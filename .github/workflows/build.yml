name: Build site

# Rebuilds generated HTML whenever homepage or work-page content changes,
# applies CMS-derived structured data, and commits the generated pages back.
# Pages serves the committed files.
#
# Deliberately NOT "Pages source = Actions": if this workflow ever breaks, the
# site degrades to stale rather than to a 404. mattadam.art is an outreach
# landing page, so serving yesterday's copy beats serving nothing.

on:
  push:
    branches: [main]
    paths:
      - content.json
      - work.json
      - parts.html
      - template.html
      - build.py
      - build_work.py
      - structured_data.py
      - 'img/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build homepage
        run: python3 build.py

      - name: Build work page
        run: python3 build_work.py

      - name: Generate structured data from CMS content
        run: |
          python3 structured_data.py
          python3 structured_data.py --check

      - name: Commit generated HTML if it changed
        run: |
          if git diff --quiet -- index.html work/index.html; then
            echo "generated HTML already up to date"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html work/index.html
          git commit -m "Rebuild generated pages [skip ci]"
          git push
