name: Build site

# Rebuilds generated HTML whenever homepage or work-page content changes,
# normalizes the template, applies CMS-derived structured data, and commits the
# generated pages back. Pages serves the committed files.
#
# Deliberately NOT "Pages source = Actions": if this workflow ever breaks, the
# site degrades to stale rather than to a 404. mattadam.art is an outreach
# landing page, so serving yesterday's copy beats serving nothing.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build.yml
      - content.json
      - work.json
      - photography.json
      - photography-template.html
      - build_photography.py
      - parts.html
      - template.html
      - build.py
      - build_work.py
      - structured_data.py
      - clean_template_jsonld.py
      - 'img/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Remove legacy hand-maintained JSON-LD from template
        run: python3 clean_template_jsonld.py

      - name: Build homepage
        run: python3 build.py

      - name: Build work page
        run: python3 build_work.py

      - name: Build photography page
        run: python3 build_photography.py

      - name: Generate structured data from CMS content
        run: |
          python3 structured_data.py
          python3 structured_data.py --check

      - name: Commit normalized template and generated HTML if changed
        run: |
          git add template.html index.html work/index.html photography
          if git diff --cached --quiet; then
            echo "template and generated HTML already up to date"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add template.html index.html work/index.html photography
          git commit -m "Normalize template and rebuild pages [skip ci]"
          git push

      # Commits made with GITHUB_TOKEN do not trigger another Pages deployment.
      # Explicitly request and verify publication after generated HTML is pushed.
      - name: Publish rebuilt site and verify Pages build
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const { data: head } = await github.rest.git.getRef({ owner, repo, ref: 'heads/main' });
            const expected = head.object.sha;
            await github.request('POST /repos/{owner}/{repo}/pages/builds', { owner, repo });
            for (let attempt = 0; attempt < 60; attempt++) {
              await new Promise(resolve => setTimeout(resolve, 5000));
              const { data: build } = await github.request('GET /repos/{owner}/{repo}/pages/builds/latest', { owner, repo });
              if (build.commit !== expected) continue;
              if (build.status === 'errored') throw new Error(build.error?.message || 'Pages build failed');
              if (build.status === 'built') {
                core.info(`Published ${expected} to https://mattadam.art/`);
                return;
              }
            }
            throw new Error(`Timed out waiting for Pages to publish ${expected}`);
