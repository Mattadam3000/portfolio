name: Build site

# Rebuilds index.html from content.json whenever content or templates change,
# and commits it back. Pages then serves the committed index.html.
#
# Deliberately NOT "Pages source = Actions": if this workflow ever breaks, the
# site degrades to stale rather than to a 404. mattadam.art is the landing page
# for outreach email, so serving yesterday's copy beats serving nothing.

on:
  push:
    branches: [main]
    paths:
      - content.json
      - parts.html
      - template.html
      - build.py
      - 'img/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false      # serialize rapid CMS commits; never drop one

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build
        run: python3 build.py

      - name: Commit index.html if it changed
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html already up to date"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Rebuild index.html [skip ci]"
          git push
