name: Homepage vision preview

on:
  push:
    branches: [homepage-vision-preview]
    paths:
      - index.html
      - build_homepage_preview.py
      - .github/workflows/homepage-vision-preview.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build static preview copy
        run: python3 build_homepage_preview.py

      - name: Verify preview
        run: |
          test -s preview/index.html
          grep -q 'ART / WORK ↗' preview/index.html
          grep -q 'homepage-vision-preview-patch' preview/index.html
          grep -q 'noindex,nofollow' preview/index.html

      - name: Commit preview copy
        run: |
          if [ -z "$(git status --porcelain -- preview/index.html)" ]; then
            echo "preview already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/index.html
          git commit -m "Build homepage vision preview [skip ci]"
          git push
