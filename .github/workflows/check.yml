name: Check

# Runs on pull requests so malformed homepage/work-page content or stale
# structured data fails before the change can reach the live site.

on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Render and validate homepage
        run: python3 build.py

      - name: Render and validate work page
        run: |
          python3 build_work.py
          test -s work/index.html
          grep -q 'mattadam.art/work/' work/index.html
          grep -q 'UNWRAP &amp; STEAL' work/index.html

      - name: Generate and validate structured data
        run: |
          python3 structured_data.py
          python3 structured_data.py --check

      - name: Verify CMS editors remain isolated
        run: |
          grep -q 'file: content.json' admin/config.yml
          grep -q 'file: work.json' admin/work/config.yml
          grep -q 'ONLY mattadam.art/work' admin/work/config.yml

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install test deps
        working-directory: test
        run: npm install --no-audit --no-fund

      - name: Smoke test the rendered homepage
        run: node test/smoke.js
