name: Finalize V5 Images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-v5-images.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image validation dependency
        run: python3 -m pip install --quiet Pillow
      - name: Snapshot protected work files
        run: |
          sha256sum work/index.html work.json build_work.py admin/work/config.yml > /tmp/work-before.sha
      - name: Normalize image filenames and CMS metadata
        run: |
          mv 'img/IMG_8797 2.JPEG' img/future-the-real-me-times-square-matt-adam.jpg
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('content.json')
          d=json.loads(p.read_text())
          blocks={b['id']:b for b in d['blocks']}
          real=blocks['real-me']['body'][0]['media']['images'][0]
          real['src']='/img/future-the-real-me-times-square-matt-adam.jpg'
          real['w']=1152; real['h']=2048
          duo=next(x for x in blocks['paintings']['body'] if x.get('kind')=='duo')
          duo['images'][0]['src']='/img/ozempic-paintings-matt-adam.jpg'
          duo['images'][0]['w']=1536; duo['images'][0]['h']=2048
          duo['images'][1]['src']='/img/ozempic-cross-camo-paintings-matt-adam.jpg'
          duo['images'][1]['w']=1536; duo['images'][1]['h']=2048
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2)+'\n')
          PY
      - name: Validate exact image dimensions
        run: |
          python3 - <<'PY'
          from PIL import Image
          expected={
            'img/future-the-real-me-times-square-matt-adam.jpg':(1152,2048),
            'img/ozempic-paintings-matt-adam.jpg':(1536,2048),
            'img/ozempic-cross-camo-paintings-matt-adam.jpg':(1536,2048),
          }
          for p,sz in expected.items():
            with Image.open(p) as im:
              assert im.size==sz,(p,im.size,sz)
              print(p, im.size)
          PY
      - name: Build and validate homepage
        run: |
          python3 clean_template_jsonld.py
          python3 build.py
          python3 structured_data.py
          python3 structured_data.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Smoke test homepage
        run: |
          cd test && npm install --no-audit --no-fund && cd ..
          node test/smoke.js
      - name: Verify work untouched
        run: |
          sha256sum -c /tmp/work-before.sha
          test -z "$(git diff --name-only -- work/index.html work.json build_work.py admin/work/)"
      - name: Commit final image fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content.json template.html index.html img/future-the-real-me-times-square-matt-adam.jpg img/ozempic-paintings-matt-adam.jpg img/ozempic-cross-camo-paintings-matt-adam.jpg
          git add -u -- 'img/IMG_8797 2.JPEG'
          git diff --cached --quiet && exit 0
          git commit -m 'Use original high-res homepage images [skip ci]'
          git push
