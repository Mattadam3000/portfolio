name: Finalize V5 Images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-v5-images.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image validation dependency
        run: python3 -m pip install --quiet Pillow
      - name: Snapshot protected work files
        run: |
          sha256sum work/index.html work.json build_work.py admin/work/config.yml > /tmp/work-before.sha
      - name: Normalize filenames and write actual dimensions
        run: |
          if [ -f 'img/IMG_8797 2.JPEG' ]; then mv 'img/IMG_8797 2.JPEG' img/future-the-real-me-times-square-matt-adam.jpg; fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image

          p=Path('content.json')
          d=json.loads(p.read_text())
          blocks={b['id']:b for b in d['blocks']}

          assets={
            'real': 'img/future-the-real-me-times-square-matt-adam.jpg',
            'paint1': 'img/ozempic-paintings-matt-adam.jpg',
            'paint2': 'img/ozempic-cross-camo-paintings-matt-adam.jpg',
          }
          sizes={}
          for k,path in assets.items():
            with Image.open(path) as im:
              sizes[k]=im.size
              print(path, im.size)

          real=blocks['real-me']['body'][0]['media']['images'][0]
          real['src']='/img/future-the-real-me-times-square-matt-adam.jpg'
          real['w'],real['h']=sizes['real']

          duo=next(x for x in blocks['paintings']['body'] if x.get('kind')=='duo')
          duo['images'][0]['src']='/img/ozempic-paintings-matt-adam.jpg'
          duo['images'][0]['w'],duo['images'][0]['h']=sizes['paint1']
          duo['images'][1]['src']='/img/ozempic-cross-camo-paintings-matt-adam.jpg'
          duo['images'][1]['w'],duo['images'][1]['h']=sizes['paint2']

          assert sizes['real'][0] >= 1152 and sizes['real'][1] >= 2048
          assert sizes['paint1'][0] >= 1536 and sizes['paint1'][1] >= 2048
          assert sizes['paint2'][0] >= 1536 and sizes['paint2'][1] >= 2048

          p.write_text(json.dumps(d, ensure_ascii=False, indent=2)+'\n')
          PY
      - name: Build and validate homepage
        run: |
          python3 clean_template_jsonld.py
          python3 build.py
          python3 structured_data.py
          python3 structured_data.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Smoke test homepage
        run: |
          cd test && npm install --no-audit --no-fund && cd ..
          node test/smoke.js
      - name: Verify work untouched
        run: |
          sha256sum -c /tmp/work-before.sha
          test -z "$(git diff --name-only -- work/index.html work.json build_work.py admin/work/)"
      - name: Commit final image fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content.json index.html img/future-the-real-me-times-square-matt-adam.jpg img/ozempic-paintings-matt-adam.jpg img/ozempic-cross-camo-paintings-matt-adam.jpg
          git add -u -- 'img/IMG_8797 2.JPEG'
          git diff --cached --quiet && exit 0
          git commit -m 'Use original high-res homepage images [skip ci]'
          git push
