<script>
(() => {
 if (!document.documentElement.classList.contains('gallery')) return;
 const track = document.querySelector('#projects');
 const slides = [...track.querySelectorAll('.slide')];
 const controls = document.querySelector('.gallery-controls');
 if (slides.length < 2) return;
 controls.hidden = false;
 track.setAttribute('aria-roledescription', 'carousel');
 const dots = document.querySelector('.gallery-dots');
 const prev = document.querySelector('.gallery-prev');
 const next = document.querySelector('.gallery-next');
 let active = 0, target = 0, ticking = false, scrollTimer;
 const go = (index, smooth = true) => {
  target = active = Math.max(0, Math.min(slides.length - 1, index));
  track.scrollTo({left: active * track.clientWidth, behavior: smooth && !matchMedia('(prefers-reduced-motion: reduce)').matches ? 'smooth' : 'instant'});
  update();
 };
 slides.forEach((slide, i) => {
  slide.setAttribute('role', 'group');
  slide.setAttribute('aria-roledescription', 'slide');
  slide.setAttribute('aria-label', `Photograph ${i + 1} of ${slides.length}`);
  const dot = document.createElement('button');
  dot.type = 'button'; dot.setAttribute('aria-label', `Go to photograph ${i + 1}`);
  dot.onclick = () => go(i); dots.append(dot);
 });
 function update() {
  slides.forEach((slide, i) => {if (Math.abs(i - active) <= 1) {const image = slide.querySelector('img'); if (image) image.loading = 'eager';}});
  prev.disabled = active === 0; next.disabled = active === slides.length - 1;
  [...dots.children].forEach((dot, i) => dot.setAttribute('aria-current', String(i === active)));
  const dot = dots.children[active];
  dots.scrollTo({left:dot.offsetLeft - dots.offsetLeft - dots.clientWidth / 2 + dot.clientWidth / 2,behavior:'instant'});
  document.querySelector('.gallery-status').textContent = `Photograph ${active + 1} of ${slides.length}`;
 }
 prev.onclick = () => go(target - 1); next.onclick = () => go(target + 1);
 track.addEventListener('pointerdown', () => {target = active;});
 track.addEventListener('scroll', () => {
  clearTimeout(scrollTimer); scrollTimer = setTimeout(() => {target = active;}, 180);
  if (ticking) return; ticking = true;
  requestAnimationFrame(() => {active = Math.max(0, Math.min(slides.length - 1, Math.round(track.scrollLeft / track.clientWidth))); update(); ticking = false;});
 }, {passive:true});
 document.addEventListener('keydown', e => {
  if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if (!['ArrowLeft','ArrowRight','Home','End'].includes(e.key)) return;
  e.preventDefault(); go(e.key === 'Home' ? 0 : e.key === 'End' ? slides.length - 1 : target + (e.key === 'ArrowRight' ? 1 : -1));
 });
 new ResizeObserver(() => go(target, false)).observe(track);
 update();
})();
// Native scrolling and links work without JavaScript; keyboard paging is optional.
document.addEventListener('keydown',event=>{
 if(document.documentElement.classList.contains('gallery'))return;
 if(event.altKey||event.ctrlKey||event.metaKey||event.shiftKey||!['ArrowDown','ArrowUp','PageDown','PageUp'].includes(event.key)||/INPUT|TEXTAREA|SELECT/.test(event.target.tagName))return;
 const slides=[...document.querySelectorAll('.slide')];
 const current=slides.reduce((best,item,index)=>Math.abs(item.getBoundingClientRect().top)<Math.abs(slides[best].getBoundingClientRect().top)?index:best,0);
 const direction=['ArrowDown','PageDown'].includes(event.key)?1:-1;
 const next=Math.max(0,Math.min(slides.length-1,current+direction));
 event.preventDefault();slides[next]?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'start'});
});
</script>
<script>
// GitHub Pages caches HTML for ten minutes. Check a tiny uncached build marker
// so an open or restored portfolio moves to the latest published version.
(() => {
 if (window.parent !== window) return;
 const address = new URL(location.href);
 const requestedVersion = address.searchParams.get('v');
 if (requestedVersion !== null) {
  address.searchParams.delete('v');
  history.replaceState(history.state, '', address.pathname + address.search + address.hash);
 }
 const current = document.querySelector('meta[name="photography-version"]').content;
 let checking = false;
 async function checkVersion() {
  if (checking || document.hidden || !navigator.onLine) return;
  checking = true;
  try {
   const response = await fetch('/photography/version.json?fresh=' + Date.now(), {cache:'no-store'});
   if (!response.ok) return;
   const {version} = await response.json();
   if (!/^[a-f0-9]{16}$/.test(version) || version === current) return;
   const next = new URL(location.href);
   if (requestedVersion === version) return;
   next.searchParams.set('v', version);
   location.replace(next.href);
  } catch (_) { /* An offline portfolio remains usable. */ }
  finally { checking = false; }
 }
 window.addEventListener('pageshow', checkVersion);
 window.addEventListener('focus', checkVersion);
 document.addEventListener('visibilitychange', checkVersion);
 setInterval(checkVersion, 30000);
})();
</script>
