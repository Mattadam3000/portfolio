<!doctype html>
<html lang="en" class="{{MODE}}" data-start="{{START}}">
<head>
<meta charset="utf-8">
<meta name="photography-version" content="{{VERSION}}">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="canonical" href="{{CANONICAL}}">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:url" content="{{CANONICAL}}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='black'/%3E%3Ctext x='32' y='49' text-anchor='middle' font-size='56' fill='white'%3E◎%3C/text%3E%3C/svg%3E">
<style>
:root{--paper:#fff;--ink:#0a0a0a;--pad:clamp(18px,3vw,48px);--mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
*{box-sizing:border-box}html{background:var(--paper);scroll-snap-type:y mandatory;scroll-padding:0}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}a:hover{opacity:.6}a:focus-visible{outline:2px solid currentColor;outline-offset:5px}::selection{background:var(--ink);color:var(--paper)}
.topbar{position:fixed;inset:0 0 auto;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px var(--pad);background:var(--paper);min-height:64px}.mark{font-weight:700;letter-spacing:-.03em;font-size:16px;line-height:1;white-space:nowrap}.topbar nav{display:flex;gap:24px;font-family:var(--mono);font-size:12px;line-height:1.4}.topbar a{min-height:40px;display:inline-flex;align-items:center;gap:4px}
.slide{height:100vh;height:100svh;min-height:360px;scroll-snap-align:start;scroll-snap-stop:always;padding:72px var(--pad) max(16px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:18px;position:relative}.image-stage{flex:1 1 0;min-height:0;display:flex;align-items:center;justify-content:center;width:100%;overflow:hidden}.image-stage img{display:block;width:100%;height:100%;object-fit:contain}.image-stage:hover{opacity:1}a.image-stage{cursor:pointer}.caption{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-shrink:0;min-height:34px}.project-label{display:flex;flex-direction:column;gap:4px;max-width:calc(100% - 75px);font-size:13px;line-height:1.35;letter-spacing:-.005em}.description{font-size:12px;color:#555}.description:empty{display:none}.view-link,.counter{font-family:var(--mono);font-size:12px;line-height:1.4;white-space:nowrap}.view-link{min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:flex-end;gap:6px}.counter{padding-bottom:4px}.empty{justify-content:center;align-items:center}.skip{position:fixed;top:8px;left:var(--pad);z-index:30;transform:translateY(-200%);padding:12px;background:var(--paper)}.skip:focus{transform:none}
@media(max-width:600px){.topbar{min-height:58px;padding:9px var(--pad)}.topbar nav{gap:18px}.mark{font-size:14px}.slide{padding-top:66px;gap:14px;padding-bottom:max(18px,env(safe-area-inset-bottom))}.caption{gap:14px}.project-label{font-size:13px;max-width:calc(100% - 65px)}.description{font-size:12px;line-height:1.4}}
@media(max-height:500px) and (orientation:landscape){.slide{min-height:280px;padding-top:54px;gap:8px;padding-bottom:8px}.topbar{min-height:48px;padding-top:4px;padding-bottom:4px}.caption{min-height:20px}.project-label{flex-direction:row;flex-wrap:wrap;gap:4px 16px}.view-link{min-height:30px}}
@media(prefers-reduced-motion:reduce){html{scroll-snap-type:y proximity}}
.slide{padding-bottom:96px;gap:0}
.collection-track{display:flex;flex:1;min-height:0;width:100%;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none}
.collection-track::-webkit-scrollbar{display:none}
.photo-slide{position:relative;flex:0 0 100%;width:100%;min-width:0;height:100%;scroll-snap-align:start;scroll-snap-stop:always}
.photo-slide img{display:block;width:100%;height:100%;object-fit:contain}
.photo-slide .caption{display:none}
.viewer-caption{position:fixed;right:var(--pad);bottom:38px;z-index:21;text-align:right;max-width:min(70vw,600px);pointer-events:none}
.viewer-caption[hidden]{display:none}.viewer-caption .project-label{max-width:100%;align-items:flex-end}
.gallery-controls{position:fixed;bottom:max(6px,env(safe-area-inset-bottom));left:var(--pad);right:var(--pad);height:32px;display:flex;justify-content:center;z-index:20;pointer-events:none}
.gallery-controls[hidden]{display:none}.gallery-controls button{border:0;background:none;color:var(--ink);cursor:pointer;padding:0;pointer-events:auto}
.gallery-controls button:disabled{visibility:hidden;pointer-events:none}.gallery-controls button:focus-visible{outline:1px solid currentColor}
.gallery-dots{display:flex;max-width:75%;overflow:auto;scrollbar-width:none;pointer-events:auto}.gallery-dots button{flex:0 0 12px;width:12px;height:32px}
.gallery-dots button::after{content:'';display:block;width:3px;height:3px;border-radius:50%;background:#ccc;margin:auto}.gallery-dots button[aria-current=true]::after{background:var(--ink);transform:scale(1.2)}
.gallery-prev,.gallery-next{position:fixed;top:64px;bottom:96px;width:35vw;display:flex;align-items:center;font:300 26px Helvetica,Arial,sans-serif;opacity:.4;text-shadow:0 1px 5px white}
.gallery-prev{left:0;justify-content:flex-start;padding-left:16px!important}.gallery-next{right:0;justify-content:flex-end;padding-right:16px!important}.gallery-prev:hover,.gallery-next:hover{opacity:1}
.gallery-status{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
@media(hover:none) and (pointer:coarse){.gallery-prev,.gallery-next{display:none}}
@media(max-width:600px){.slide{padding-bottom:92px}.viewer-caption{bottom:34px;max-width:85vw}}
</style>
</head>
<body>
<a class="skip" href="#projects">Skip to images</a>
<header class="topbar"><a class="mark" href="/">MATT ADAM</a><nav aria-label="Portfolio navigation">{{BACK}}<a href="{{CONTACT_URL}}">{{CONTACT_LABEL}}</a></nav></header>
<main id="projects" tabindex="-1" aria-label="Selected photographs">{{SLIDES}}</main>
<footer class="viewer-caption" hidden></footer>
<nav class="gallery-controls" aria-label="Photograph navigation" hidden><button type="button" class="gallery-prev" aria-label="Previous photograph">‹</button><div class="gallery-dots" aria-label="Choose photograph"></div><button type="button" class="gallery-next" aria-label="Next photograph">›</button><span class="gallery-status" aria-live="polite"></span></nav>
<script>
(() => {
 const sections=[...document.querySelectorAll('.slide[data-project]')];
 if(!sections.length)return;
 const caption=document.querySelector('.viewer-caption'),controls=document.querySelector('.gallery-controls'),dots=document.querySelector('.gallery-dots'),prev=document.querySelector('.gallery-prev'),next=document.querySelector('.gallery-next');
 const states=sections.map(section=>({section,track:section.querySelector('.collection-track'),photos:[...section.querySelectorAll('.photo-slide')],index:0,target:0,timer:null}));
 let active=0,group=-1;
 function update(){
  const state=states[active];
  const markup=state.photos[state.index]?.querySelector('.caption')?.innerHTML || '';
  if(caption.innerHTML!==markup)caption.innerHTML=markup;
  caption.hidden=!markup;controls.hidden=state.photos.length<2;
  prev.disabled=state.index===0;next.disabled=state.index===state.photos.length-1;
  if(group!==active){group=active;dots.replaceChildren();if(state.photos.length>1)state.photos.forEach((photo,i)=>{const dot=document.createElement('button');dot.type='button';dot.setAttribute('aria-label',`Go to photograph ${i+1}`);dot.onclick=()=>go(i);dots.append(dot);});}
  [...dots.children].forEach((dot,i)=>dot.setAttribute('aria-current',String(i===state.index)));
  document.querySelector('.gallery-status').textContent=`Photograph ${state.index+1} of ${state.photos.length}`;
  state.photos.forEach((photo,i)=>{if(Math.abs(i-state.index)<=1){const img=photo.querySelector('img');if(img)img.loading='eager';}});
 }
 function go(index,smooth=true){
  const state=states[active];
  state.target=state.index=Math.max(0,Math.min(state.photos.length-1,index));
  state.track.scrollTo({left:state.target*state.track.clientWidth,behavior:smooth&&!matchMedia('(prefers-reduced-motion: reduce)').matches?'smooth':'instant'});update();
 }
 prev.onclick=()=>go(states[active].target-1);next.onclick=()=>go(states[active].target+1);
 const observer=new IntersectionObserver(entries=>{for(const entry of entries)if(entry.isIntersecting&&entry.intersectionRatio>.5){active=sections.indexOf(entry.target);update();}},{threshold:.51});
 states.forEach((state,i)=>{
  observer.observe(state.section);
  state.track.addEventListener('pointerdown',()=>{state.target=state.index;});
  state.track.addEventListener('scroll',()=>{
   state.index=Math.max(0,Math.min(state.photos.length-1,Math.round(state.track.scrollLeft/state.track.clientWidth)));
   clearTimeout(state.timer);state.timer=setTimeout(()=>{state.target=state.index;},180);
   if(active===i)update();
  },{passive:true});
  new ResizeObserver(()=>{state.track.scrollTo({left:state.target*state.track.clientWidth,behavior:'instant'});}).observe(state.track);
 });
 document.addEventListener('keydown',e=>{
  if(e.altKey||e.ctrlKey||e.metaKey||e.shiftKey||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
  if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();go(states[active].target+(e.key==='ArrowRight'?1:-1));}
  if(['ArrowDown','ArrowUp','PageDown','PageUp'].includes(e.key)){e.preventDefault();const i=Math.max(0,Math.min(states.length-1,active+(['ArrowDown','PageDown'].includes(e.key)?1:-1)));states[i].section.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});}
 });
 const start=document.documentElement.dataset.start;
 if(start){const index=sections.findIndex(s=>s.dataset.project===start);if(index>=0){active=index;sections[index].scrollIntoView({behavior:'instant'});}}
 update();
})();
</script>
<script>
// GitHub Pages caches HTML for ten minutes. Check a tiny uncached build marker
// so an open or restored portfolio moves to the latest published version.
(() => {
 if (window.parent !== window) return;
 const address = new URL(location.href);
 const requestedVersion = address.searchParams.get('v');
 if (requestedVersion !== null) {
  address.searchParams.delete('v');
  history.replaceState(history.state, '', address.pathname + address.search + address.hash);
 }
 const current = document.querySelector('meta[name="photography-version"]').content;
 let checking = false;
 async function checkVersion() {
  if (checking || document.hidden || !navigator.onLine) return;
  checking = true;
  try {
   const response = await fetch('/photography/version.json?fresh=' + Date.now(), {cache:'no-store'});
   if (!response.ok) return;
   const {version} = await response.json();
   if (!/^[a-f0-9]{16}$/.test(version) || version === current) return;
   const next = new URL(location.href);
   if (requestedVersion === version) return;
   next.searchParams.set('v', version);
   location.replace(next.href);
  } catch (_) { /* An offline portfolio remains usable. */ }
  finally { checking = false; }
 }
 window.addEventListener('pageshow', checkVersion);
 window.addEventListener('focus', checkVersion);
 document.addEventListener('visibilitychange', checkVersion);
 setInterval(checkVersion, 30000);
})();
</script>
</body>
</html>
